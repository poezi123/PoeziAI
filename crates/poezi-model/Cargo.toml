[package]
name = "poezi-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
poezi-gguf.workspace = true
poezi-tensor.workspace = true
poezi-cuda = { path = "../poezi-cuda" }
# Backtracking regex: the Qwen2 pre-tokenizer pattern uses a `(?!\S)`
# lookahead, which the standard `regex` crate does not support. fancy-regex
# also matches Python/PCRE semantics, which is what GPT-2-style BPE expects.
fancy-regex = "0.14"
serde_json = "1"
